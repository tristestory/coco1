        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const GEMINI_MODELS = [
            "gemini-3-flash-preview",
            "gemini-2.5-flash",
            "gemini-2.0-flash"
        ];

        // Gemini가 저작물 재현(RECITATION) 정책으로 응답을 막은 경우를 구분하기 위한 오류 타입
        class RecitationBlockedError extends Error {
            constructor() {
                super("Gemini가 저작물 재현 방지 정책(RECITATION)으로 이 페이지의 응답을 차단했습니다.");
                this.name = 'RecitationBlockedError';
            }
        }

        async function callGemini({ apiKey, parts }) {
            let lastErrorMessage = "";

            for (const modelName of GEMINI_MODELS) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`;
                let response, responseData;
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey
                        },
                        body: JSON.stringify({ contents: [{ role: "user", parts }] })
                    });
                    responseData = await response.json().catch(() => ({}));
                } catch (err) {
                    lastErrorMessage = err.message || "네트워크 통신 오류가 발생했습니다.";
                    continue;
                }

                if (!response.ok) {
                    const apiErrorMsg = responseData?.error?.message || responseData?.error?.status || `HTTP ${response.status}`;
                    if (response.status === 401 || response.status === 403 ||
                        (response.status === 400 && /api key/i.test(apiErrorMsg))) {
                        throw new Error("Gemini API 키가 올바르지 않거나 권한이 없습니다. [🔑 API 키 설정]에서 확인해주세요.");
                    }
                    lastErrorMessage = `API 오류 (${modelName}, ${response.status}): ${apiErrorMsg}`;
                    continue;
                }

                const candidate = responseData?.candidates?.[0];
                const text = candidate?.content?.parts?.map(p => p.text || '').join('');

                if (text && text.trim().length > 0) {
                    return text;
                }
                // 정책 차단은 다른 모델로 다시 보내도 같은 결과이므로 바로 알린다
                if (candidate?.finishReason === 'RECITATION') {
                    throw new RecitationBlockedError();
                }
                if (candidate?.finishReason === 'SAFETY' || responseData?.promptFeedback?.blockReason) {
                    throw new Error("안전성(Safety) 정책에 의해 해당 이미지 스캔이 차단되었습니다.");
                }
                lastErrorMessage = "응답은 성공했으나 이미지에서 추출된 텍스트 내용이 없습니다.";
            }

            throw new Error(lastErrorMessage || "Gemini 요청에 실패했습니다.");
        }

        async function runSingleGeminiOCR({ base64Image, mimeType, mode, targetLang, customInstruction, removeBookHeaderFooter, includePageDelimiter, apiKey }) {
            if (!apiKey || !apiKey.trim()) {
                throw new Error("Gemini API 키가 설정되지 않았습니다. 상단 [🔑 API 키 설정] 메뉴에서 Google Gemini API 키를 먼저 입력하세요.");
            }

            let cleanBase64 = base64Image;
            let extractedMime = mimeType || "image/jpeg";

            if (base64Image.includes(';base64,')) {
                const parts = base64Image.split(';base64,');
                const mimeMatch = parts[0].match(/data:(.*?)$/);
                if (mimeMatch) extractedMime = mimeMatch[1];
                cleanBase64 = parts[1];
            }

            let promptText;
            switch (mode) {
                case 'markdown':
                    promptText = "Transcribe all visible characters into structured Markdown with headings, paragraphs, and tables. Do not omit words.";
                    break;
                case 'plain':
                    promptText = "Extract all text line-by-line into clear text format.";
                    break;
                case 'table':
                    promptText = "Extract all tabular data or tables in this image into clean Markdown tables.";
                    break;
                case 'translate':
                    promptText = `Extract text and translate into ${targetLang}. Show 1. Original 2. Translation.`;
                    break;
                case 'keyvalue':
                    promptText = "Extract document key-value pairs as valid JSON.";
                    break;
                case 'handwriting':
                    promptText = "Transcribe handwritten or complex book layout text precisely.";
                    break;
                default:
                    promptText = "Extract all visible characters from this document page image.";
            }

            if (removeBookHeaderFooter) {
                promptText += "\n\nBOOK SCAN RULE: Omit running headers, running chapter titles, and bottom margin text. Extract only the main body text.";
            }

            if (includePageDelimiter) {
                promptText += "\n\nPRINTED PAGE DETECTOR: Check if an actual printed page number exists on this page image (e.g. '124' or '45'). If visible, start your response with a single header line: '<page [Printed Page Number]>'. If NO page number is printed or visible, DO NOT include any '<page ...>' header at all.";
            }

            if (customInstruction && customInstruction.trim() !== '') {
                promptText += `\nAdditional Instruction: ${customInstruction}`;
            }

            return callGemini({
                apiKey: apiKey.trim(),
                parts: [
                    { text: promptText },
                    { inlineData: { mimeType: extractedMime, data: cleanBase64 } }
                ]
            });
        }

        // Tesseract worker는 언어 데이터 로딩 비용이 크므로 배치 하나에서 재사용한다
        async function createTesseractWorker(onProgress) {
            if (!window.Tesseract) {
                throw new Error("Tesseract.js 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인하거나 다시 시도해 주세요.");
            }
            const progressRef = { current: onProgress };
            const worker = await window.Tesseract.createWorker('kor+eng', 1, {
                logger: m => {
                    if (m.status === 'recognizing text' && progressRef.current) {
                        progressRef.current(Math.round(m.progress * 100));
                    }
                }
            });
            worker._progressRef = progressRef;
            return worker;
        }

        async function runSingleTesseractOCR({ worker, base64Image, onProgress }) {
            try {
                worker._progressRef.current = onProgress;
                const ret = await worker.recognize(base64Image);

                if (!ret || !ret.data || !ret.data.text) {
                    throw new Error("Tesseract 스캔 결과 텍스트가 없습니다.");
                }

                return ret.data.text;
            } catch (err) {
                console.error("Tesseract error:", err);
                throw new Error(`Tesseract 로컬 OCR 오류: ${err.message || "텍스트 인식 실패"}`);
            }
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error("이미지를 불러오지 못했습니다."));
                image.src = src;
            });
        }

        // OCR 결과는 이미지 속 글자나 AI 응답에서 오므로 스크립트가 섞여 있을 수 있다
        function renderMarkdownSafely(markdown) {
            if (!window.marked || !window.DOMPurify) {
                const div = document.createElement('div');
                div.textContent = markdown;
                return `<pre class="whitespace-pre-wrap">${div.innerHTML}</pre>`;
            }
            return window.DOMPurify.sanitize(window.marked.parse(markdown));
        }

        function applyImageFilters(imgElement, filters) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const { rotation, brightness, contrast, grayscale } = filters;

            const isRotated90 = rotation === 90 || rotation === 270;
            const width = isRotated90 ? imgElement.naturalHeight : imgElement.naturalWidth;
            const height = isRotated90 ? imgElement.naturalWidth : imgElement.naturalHeight;

            canvas.width = width;
            canvas.height = height;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((rotation * Math.PI) / 180);

            let filterStr = `brightness(${100 + Number(brightness)}%) contrast(${100 + Number(contrast)}%)`;
            if (grayscale) {
                filterStr += ' grayscale(100%)';
            }
            ctx.filter = filterStr;

            ctx.drawImage(
                imgElement,
                -imgElement.naturalWidth / 2,
                -imgElement.naturalHeight / 2
            );

            ctx.restore();
            return canvas.toDataURL('image/jpeg', 0.95);
        }

        function App() {
            const [apiKey, setApiKey] = React.useState(() => localStorage.getItem('gemini_api_key') || '');
            const [isApiKeyModalOpen, setIsApiKeyModalOpen] = React.useState(false);
            const [tempApiKeyInput, setTempApiKeyInput] = React.useState('');

            // Engine Selection: 'gemini' (AI 서식 인식) | 'tesseract' (로컬 오프라인)
            const [ocrEngine, setOcrEngine] = React.useState('gemini');

            const [pages, setPages] = React.useState([]);
            const [selectedPageIndex, setSelectedPageIndex] = React.useState(0);
            const [isPasteFocused, setIsPasteFocused] = React.useState(false);

            const [filters, setFilters] = React.useState({
                rotation: 0,
                brightness: 0,
                contrast: 20,
                grayscale: false
            });

            const [thumbnailLayout, setThumbnailLayout] = React.useState('carousel');

            const [ocrMode, setOcrMode] = React.useState('markdown');
            const [targetLang, setTargetLang] = React.useState('Korean');
            const [customInstruction, setCustomInstruction] = React.useState('');
            const [removeBookHeaderFooter, setRemoveBookHeaderFooter] = React.useState(true);
            const [includePageDelimiter, setIncludePageDelimiter] = React.useState(true);
            const [fallbackToTesseract, setFallbackToTesseract] = React.useState(true);

            const [isLoading, setIsLoading] = React.useState(false);
            const [progressStatus, setProgressStatus] = React.useState({ current: 0, total: 0, detail: '' });
            const [ocrResult, setOcrResult] = React.useState('');
            const [activeResultTab, setActiveResultTab] = React.useState('formatted');
            
            const [history, setHistory] = React.useState([]);
            const [isHistoryOpen, setIsHistoryOpen] = React.useState(false);
            const [toast, setToast] = React.useState(null);

            const [chatInput, setChatInput] = React.useState('');
            const [chatMessages, setChatMessages] = React.useState([]);
            const [isChatLoading, setIsChatLoading] = React.useState(false);

            const [isSpeaking, setIsSpeaking] = React.useState(false);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            React.useEffect(() => {
                try {
                    const saved = localStorage.getItem('omni_ocr_history');
                    if (saved) setHistory(JSON.parse(saved));
                } catch (e) {
                    console.error("History load error", e);
                }
            }, []);

            const handleSortPagesByName = () => {
                if (pages.length <= 1) return;
                const sorted = [...pages].sort((a, b) => 
                    a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
                );
                setPages(sorted);
                setSelectedPageIndex(0);
                showToast('파일 이름 숫자 순서대로 정렬되었습니다.', 'success');
            };

            const handleFilesUpload = async (fileList) => {
                if (!fileList || fileList.length === 0) return;

                const newPages = [];
                setIsLoading(true);

                for (let i = 0; i < fileList.length; i++) {
                    const selectedFile = fileList[i];

                    if (selectedFile.type === 'application/pdf') {
                        try {
                            const arrayBuffer = await selectedFile.arrayBuffer();
                            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                            
                            for (let p = 1; p <= pdf.numPages; p++) {
                                const pdfPage = await pdf.getPage(p);
                                const viewport = pdfPage.getViewport({ scale: 2.0 });
                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;

                                await pdfPage.render({ canvasContext: context, viewport: viewport }).promise;
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);

                                newPages.push({
                                    id: `${Date.now()}_pdf_${p}_${Math.random()}`,
                                    name: `${selectedFile.name.replace(/\.[^/.]+$/, "")}_page_${p}.jpg`,
                                    rawSrc: dataUrl,
                                    processedSrc: dataUrl
                                });
                            }
                            showToast(`PDF (${pdf.numPages}페이지)가 개별 이미지로 변환되었습니다.`, 'success');
                        } catch (err) {
                            console.error('PDF extraction error:', err);
                            showToast('PDF 파일을 변환하는 중 오류가 발생했습니다.', 'error');
                        }
                    } else if (selectedFile.type.startsWith('image/')) {
                        const dataUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(selectedFile);
                        });

                        newPages.push({
                            id: `${Date.now()}_img_${i}_${Math.random()}`,
                            name: selectedFile.name || `Pasted_Image_${Date.now()}.png`,
                            rawSrc: dataUrl,
                            processedSrc: dataUrl
                        });
                    }
                }

                if (newPages.length > 0) {
                    setPages(prev => [...prev, ...newPages]);
                }
                setIsLoading(false);
            };

            const processPasteEvent = (e) => {
                if (!e) return false;
                if (e._handledByOcr) return false;
                e._handledByOcr = true;

                const items = e.clipboardData?.items || e.clipboardData?.files;
                if (!items) return false;

                const pastedFiles = [];
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.type && item.type.startsWith('image/')) {
                        const blob = typeof item.getAsFile === 'function' ? item.getAsFile() : item;
                        if (blob) {
                            const pastedFile = new File([blob], `pasted_page_${Date.now()}_${i + 1}.png`, { type: blob.type || 'image/png' });
                            pastedFiles.push(pastedFile);
                        }
                    }
                }

                if (pastedFiles.length > 0) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    handleFilesUpload(pastedFiles);
                    return true;
                }
                return false;
            };

            React.useEffect(() => {
                const handleGlobalPaste = (e) => {
                    if (e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text' && !e.target.classList.contains('paste-prompt-input'))) {
                        return;
                    }
                    processPasteEvent(e);
                };

                window.addEventListener('paste', handleGlobalPaste);
                return () => window.removeEventListener('paste', handleGlobalPaste);
            }, [pages]);

            React.useEffect(() => {
                if (pages.length === 0 || !pages[selectedPageIndex]) return;

                const currentObj = pages[selectedPageIndex];
                const image = new Image();
                image.crossOrigin = "anonymous";
                image.src = currentObj.rawSrc;
                image.onload = () => {
                    const filteredDataUrl = applyImageFilters(image, filters);
                    setPages(prev => {
                        const updated = [...prev];
                        if (updated[selectedPageIndex]) {
                            updated[selectedPageIndex] = { ...updated[selectedPageIndex], processedSrc: filteredDataUrl };
                        }
                        return updated;
                    });
                };
            }, [selectedPageIndex, filters, pages.length]);

            const handleStartBatchOCR = async () => {
                if (pages.length === 0) {
                    showToast('스캔할 이미지나 PDF 문서를 먼저 업로드하세요.', 'error');
                    return;
                }

                setIsLoading(true);
                setProgressStatus({ current: 0, total: pages.length, detail: '' });
                setOcrResult('');

                let fullCombinedResult = '';
                const fallbackPages = [];
                let tesseractWorker = null;
                const getTesseractWorker = async () => {
                    if (!tesseractWorker) tesseractWorker = await createTesseractWorker();
                    return tesseractWorker;
                };

                try {
                    for (let idx = 0; idx < pages.length; idx++) {
                        const pageObj = pages[idx];
                        const setDetail = (detail) => setProgressStatus({ current: idx + 1, total: pages.length, detail });
                        setDetail(`${ocrEngine.toUpperCase()} 스캔 중...`);

                        // 미리보기에서 선택하지 않은 페이지에도 현재 보정 필터를 동일하게 적용
                        const imageSrc = applyImageFilters(await loadImage(pageObj.rawSrc), filters);
                        const runTesseract = async () => runSingleTesseractOCR({
                            worker: await getTesseractWorker(),
                            base64Image: imageSrc,
                            onProgress: (pct) => setDetail(`로컬 Tesseract 인식 진행률: ${pct}%`)
                        });

                        let pageText = '';

                        if (ocrEngine === 'gemini') {
                            try {
                                pageText = await runSingleGeminiOCR({
                                    base64Image: imageSrc,
                                    mimeType: 'image/jpeg',
                                    mode: ocrMode,
                                    targetLang: targetLang,
                                    customInstruction: customInstruction,
                                    removeBookHeaderFooter: removeBookHeaderFooter,
                                    includePageDelimiter: includePageDelimiter,
                                    apiKey: apiKey
                                });
                            } catch (err) {
                                if (!(err instanceof RecitationBlockedError) || !fallbackToTesseract) throw err;
                                // 차단 정책을 우회하지 않고, 해당 페이지만 내 PC의 로컬 엔진으로 직접 인식
                                fallbackPages.push(idx + 1);
                                pageText = await runTesseract();
                            }
                        } else if (ocrEngine === 'tesseract') {
                            pageText = await runTesseract();
                        }

                        fullCombinedResult += pageText.trim() + '\n\n';
                        setOcrResult(fullCombinedResult.trim());
                    }

                    setActiveResultTab(ocrMode === 'keyvalue' ? 'raw' : 'formatted');
                    if (fallbackPages.length > 0) {
                        showToast(`스캔 완료. ${fallbackPages.join(', ')}페이지는 Gemini 정책 차단으로 로컬 Tesseract로 인식했습니다.`, 'info');
                    } else {
                        showToast(`스캔 완료! [${ocrEngine.toUpperCase()} 엔진 사용]`, 'success');
                    }

                    const historyItem = {
                        id: Date.now(),
                        title: `[${ocrEngine.toUpperCase()}] ${pages.length}개 페이지 스캔 (${new Date().toLocaleTimeString()})`,
                        timestamp: new Date().toLocaleString(),
                        engine: ocrEngine,
                        snippet: fullCombinedResult.slice(0, 120) + '...',
                        result: fullCombinedResult,
                    };
                    const updatedHistory = [historyItem, ...history.slice(0, 19)];
                    setHistory(updatedHistory);
                    try {
                        localStorage.setItem('omni_ocr_history', JSON.stringify(updatedHistory));
                    } catch (e) {
                        console.warn("History save error", e);
                        showToast('스캔은 완료됐지만 브라우저 저장 공간이 부족해 기록을 저장하지 못했습니다.', 'error');
                    }

                } catch (err) {
                    console.error(err);
                    if (err instanceof RecitationBlockedError) {
                        showToast(`${err.message} '정책으로 차단한 페이지는 로컬 Tesseract로 인식' 옵션을 켜거나 로컬 Tesseract 엔진을 선택하세요.`, 'error');
                    } else {
                        showToast(err.message || 'OCR 처리 중 오류가 발생했습니다.', 'error');
                    }
                } finally {
                    if (tesseractWorker) await tesseractWorker.terminate().catch(() => {});
                    setIsLoading(false);
                }
            };

            const handleRemovePage = (index) => {
                const remaining = pages.length - 1;
                setPages(prev => prev.filter((_, i) => i !== index));
                if (index < selectedPageIndex || selectedPageIndex >= remaining) {
                    setSelectedPageIndex(Math.max(0, Math.min(selectedPageIndex - 1, remaining - 1)));
                }
            };

            const handleSaveApiKey = () => {
                const cleanGeminiKey = tempApiKeyInput.trim();
                setApiKey(cleanGeminiKey);
                localStorage.setItem('gemini_api_key', cleanGeminiKey);
                setIsApiKeyModalOpen(false);
                showToast('Gemini API 키가 저장되었습니다.', 'success');
            };

            const handleToggleTTS = () => {
                if (!ocrResult) return;
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                } else {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(ocrResult);
                    utterance.lang = /[\uAC00-\uD7A3]/.test(ocrResult) ? 'ko-KR' : 'en-US';
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    setIsSpeaking(true);
                    window.speechSynthesis.speak(utterance);
                }
            };

            const handleCopyText = () => {
                if (!ocrResult) return;
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = ocrResult;
                    textarea.style.position = 'fixed';
                    textarea.style.top = '0';
                    textarea.style.left = '0';
                    textarea.style.width = '2em';
                    textarea.style.height = '2em';
                    textarea.style.padding = '0';
                    textarea.style.border = 'none';
                    textarea.style.outline = 'none';
                    textarea.style.boxShadow = 'none';
                    textarea.style.background = 'transparent';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();

                    const successful = document.execCommand('copy');
                    document.body.removeChild(textarea);

                    if (successful) {
                        showToast('클립보드에 전체 텍스트가 복사되었습니다.', 'success');
                    } else {
                        showToast('복사에 실패했습니다.', 'error');
                    }
                } catch (err) {
                    console.error('Copy error:', err);
                    showToast('복사에 실패했습니다.', 'error');
                }
            };

            const handleDownload = (format) => {
                if (!ocrResult) return;
                let mime = 'text/plain';
                let ext = 'txt';
                if (format === 'md') {
                    ext = 'md';
                    mime = 'text/markdown';
                }

                const blob = new Blob([ocrResult], { type: `${mime};charset=utf-8` });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `OCR_Result_${Date.now()}.${ext}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast(`${ext.toUpperCase()} 파일로 다운로드되었습니다.`, 'success');
            };

            const handleSendChatMessage = async () => {
                if (!chatInput.trim() || !ocrResult) return;
                if (!apiKey || !apiKey.trim()) {
                    showToast("질문 기능은 Gemini API 키 설정이 필요합니다. [🔑 API 키 설정]에서 등록해주세요.", "error");
                    return;
                }

                const userMsg = chatInput.trim();
                setChatInput('');
                setChatMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setIsChatLoading(true);

                try {
                    const aiAnswer = await callGemini({
                        apiKey: apiKey.trim(),
                        parts: [{ text: `다음은 추출된 문서 내용입니다:\n---\n${ocrResult}\n---\n\n질문에 친절하고 명확하게 답변해 주세요:\n질문: ${userMsg}` }]
                    });
                    setChatMessages(prev => [...prev, { role: 'assistant', content: aiAnswer }]);
                } catch (err) {
                    console.warn('Chat failed:', err);
                    setChatMessages(prev => [...prev, { role: 'assistant', content: `질문 처리 중 오류가 발생했습니다: ${err.message}` }]);
                }
                setIsChatLoading(false);
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                <Icon name="scan-text" className="w-6 h-6 text-white" />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                                    Easy OCR V0.1
                                </h1>
                                <p className="text-xs text-slate-400">Gemini AI OCR & 로컬 Tesseract Engine</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            <button
                                onClick={() => {
                                    setTempApiKeyInput(apiKey);
                                    setIsApiKeyModalOpen(true);
                                }}
                                className={`px-3 py-1.5 text-xs font-medium rounded-lg flex items-center space-x-1.5 border transition ${
                                    apiKey 
                                        ? 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700' 
                                        : 'bg-amber-500/20 text-amber-300 border-amber-500/40 hover:bg-amber-500/30'
                                }`}
                            >
                                <Icon name="key" className="w-3.5 h-3.5" />
                                <span>{apiKey ? 'Gemini 키 설정됨' : '🔑 Gemini API 키 설정'}</span>
                            </button>

                            <button
                                onClick={() => setIsHistoryOpen(!isHistoryOpen)}
                                className="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg flex items-center space-x-1.5 border border-slate-700 transition"
                            >
                                <Icon name="history" className="w-3.5 h-3.5" />
                                <span className="hidden sm:inline">스캔 기록 ({history.length})</span>
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-sm flex items-center space-x-2 transition-all ${
                            toast.type === 'error' 
                                ? 'bg-red-950/90 border-red-500/50 text-red-200' 
                                : 'bg-blue-950/90 border-blue-500/50 text-blue-200'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert-triangle' : 'check-circle-2'} className="w-5 h-5" />
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* API Key Modal */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                                    <h3 className="font-semibold text-slate-100 flex items-center space-x-2">
                                        <Icon name="key" className="w-4 h-4 text-blue-400" />
                                        <span>Gemini API 키 등록</span>
                                    </h3>
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="py-4 space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-blue-300 block mb-1">Google Gemini API Key (무료 발급)</label>
                                        <input 
                                            type="password"
                                            placeholder="AIzaSy..."
                                            value={tempApiKeyInput}
                                            onChange={(e) => setTempApiKeyInput(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-mono text-slate-200 focus:border-blue-500 outline-none"
                                        />
                                        <p className="text-[11px] text-slate-400 mt-1">
                                            스마트 서식 스캔과 문서 Q&A에 사용됩니다. 
                                            <a href="https://aistudio.google.com/" target="_blank" rel="noreferrer" className="text-blue-400 underline ml-1 hover:text-blue-300">
                                                무료 발급 받기
                                            </a>
                                        </p>
                                    </div>

                                    <div className="p-3 bg-blue-950/40 border border-blue-500/30 rounded-xl text-[11px] text-blue-200 leading-relaxed">
                                        ℹ️ 출판된 책 페이지는 Gemini의 저작물 재현 방지 정책(RECITATION)으로 응답이 차단될 수 있습니다. 이 경우 우회하지 않고, 옵션에 따라 해당 페이지만 내 브라우저의 로컬 Tesseract 엔진으로 인식합니다.
                                    </div>
                                </div>
                                <div className="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                                    <button 
                                        onClick={() => setIsApiKeyModalOpen(false)} 
                                        className="px-4 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl"
                                    >
                                        취소
                                    </button>
                                    <button 
                                        onClick={handleSaveApiKey} 
                                        className="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-lg shadow-blue-500/20"
                                    >
                                        저장하기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Layout */}
                    <main className="flex-grow p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1800px] mx-auto w-full">
                        
                        {/* LEFT PANEL: Engine Selector, Upload, Filters & Options */}
                        <div className="lg:col-span-5 flex flex-col space-y-5">
                            
                            {/* Engine Switcher Component */}
                            <div className="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xs font-semibold text-slate-200 flex items-center space-x-2">
                                        <Icon name="scan-text" className="w-4 h-4 text-blue-400" />
                                        <span>OCR 스캔 엔진 선택</span>
                                    </h2>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    {/* Engine 1: Gemini AI */}
                                    <button
                                        onClick={() => setOcrEngine('gemini')}
                                        className={`p-3 rounded-xl border text-left flex flex-col justify-between transition ${
                                            ocrEngine === 'gemini' 
                                                ? 'bg-blue-600/25 border-blue-500 text-blue-200 ring-1 ring-blue-500/40 shadow-lg shadow-blue-500/10' 
                                                : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-1.5 mb-1.5">
                                            <Icon name="sparkles" className="w-4 h-4 text-blue-400" />
                                            <span className="text-xs font-bold">Gemini AI</span>
                                        </div>
                                        <span className="text-[10px] text-slate-400 leading-tight">★ 스마트 서식 (표·제목) 인식</span>
                                    </button>

                                    {/* Engine 2: Local Tesseract (Zero Copyright Filter) */}
                                    <button
                                        onClick={() => setOcrEngine('tesseract')}
                                        className={`p-3 rounded-xl border text-left flex flex-col justify-between transition ${
                                            ocrEngine === 'tesseract' 
                                                ? 'bg-emerald-600/25 border-emerald-500 text-emerald-200 ring-1 ring-emerald-500/40 shadow-lg shadow-emerald-500/10' 
                                                : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-1.5 mb-1.5">
                                            <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                                            <span className="text-xs font-bold">로컬 Tesseract</span>
                                        </div>
                                        <span className="text-[10px] text-emerald-300/80 leading-tight">★ 브라우저 내 처리 / API 키 불필요</span>
                                    </button>
                                </div>
                            </div>

                            {/* File Upload Box */}
                            <div 
                                tabIndex={0}
                                onFocus={() => setIsPasteFocused(true)}
                                onBlur={() => setIsPasteFocused(false)}
                                className={`glass-panel p-4 rounded-2xl border transition-all duration-200 shadow-xl focus:outline-none ${
                                    isPasteFocused ? 'border-blue-500 ring-2 ring-blue-500/30 bg-blue-950/20' : 'border-slate-800'
                                }`}
                            >
                                <div className="flex items-center justify-between mb-2.5">
                                    <h2 className="text-xs font-semibold text-slate-200 flex items-center space-x-2">
                                        <Icon name="upload-cloud" className="w-4 h-4 text-blue-400" />
                                        <span>다중 파일 / PDF / 복사 이미지 추가</span>
                                    </h2>
                                    <span className="text-[11px] font-mono text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-full border border-blue-500/20">
                                        총 {pages.length}개 페이지
                                    </span>
                                </div>

                                {/* Paste Prompt Bar */}
                                <div className="mb-2.5">
                                    <div className="relative flex items-center">
                                        <input
                                            type="text"
                                            readOnly
                                            placeholder="여기를 클릭 후 Ctrl + V로 이미지 계속 붙여넣기..."
                                            onPaste={(e) => {
                                                processPasteEvent(e);
                                                e.target.blur();
                                            }}
                                            className="paste-prompt-input w-full bg-slate-900/90 border border-slate-700 hover:border-blue-500 focus:border-blue-400 focus:ring-2 focus:ring-blue-500/20 text-xs text-slate-200 placeholder-slate-400 rounded-xl px-3.5 py-2 cursor-pointer transition shadow-inner font-mono"
                                        />
                                        <span className="absolute right-3 px-2 py-0.5 bg-slate-800 text-[10px] font-mono text-slate-300 border border-slate-700 rounded-md pointer-events-none">
                                            Ctrl + V
                                        </span>
                                    </div>
                                </div>

                                <label className="relative flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-900/40 hover:bg-slate-900/80 rounded-xl p-4 cursor-pointer transition group">
                                    <input 
                                        type="file" 
                                        multiple
                                        accept="image/png, image/jpeg, image/webp, application/pdf" 
                                        onChange={(e) => handleFilesUpload(e.target.files)}
                                        className="hidden" 
                                    />
                                    <div className="flex items-center space-x-2 text-slate-300 group-hover:text-blue-300 text-xs font-medium">
                                        <Icon name="file-up" className="w-4 h-4 text-blue-400" />
                                        <span>여러 이미지 파일 또는 PDF 한 번에 선택하기</span>
                                    </div>
                                </label>
                            </div>

                            {/* Page Carousel / Grid */}
                            {pages.length > 0 && (
                                <div className="glass-panel p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-xs font-semibold text-slate-200 flex items-center space-x-1.5">
                                            <Icon name="book-open" className="w-4 h-4 text-indigo-400" />
                                            <span>스캔 순서 목록 (순차 연결)</span>
                                        </h3>

                                        <div className="flex items-center space-x-2">
                                            <button
                                                onClick={() => setThumbnailLayout(prev => prev === 'carousel' ? 'grid' : 'carousel')}
                                                className="px-2 py-1 text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg flex items-center space-x-1 transition"
                                                title="보기 모드 전환"
                                            >
                                                <span>{thumbnailLayout === 'carousel' ? '격자 보기' : '가로 보기'}</span>
                                            </button>

                                            <button
                                                onClick={handleSortPagesByName}
                                                className="px-2.5 py-1 text-xs bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 rounded-lg flex items-center space-x-1 transition"
                                                title="파일 이름 안의 숫자를 인식하여 순서대로 정렬합니다"
                                            >
                                                <Icon name="sort" className="w-3.5 h-3.5" />
                                                <span>숫자/이름순 정렬</span>
                                            </button>

                                            <button
                                                onClick={() => setPages([])}
                                                className="text-xs text-red-400 hover:text-red-300 p-1"
                                                title="전체 삭제"
                                            >
                                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Enlarged Thumbnail Cards */}
                                    <div className={`gap-3 overflow-x-auto pb-2 pt-1 scrollbar-thin ${
                                        thumbnailLayout === 'grid' 
                                            ? 'grid grid-cols-2 sm:grid-cols-3 max-h-[420px] overflow-y-auto' 
                                            : 'flex items-center'
                                    }`}>
                                        {pages.map((p, idx) => (
                                            <div 
                                                key={p.id}
                                                onClick={() => setSelectedPageIndex(idx)}
                                                className={`relative flex-shrink-0 w-32 sm:w-36 h-44 sm:h-48 rounded-xl border cursor-pointer overflow-hidden group transition-all duration-200 shadow-md ${
                                                    selectedPageIndex === idx 
                                                        ? 'border-blue-500 ring-2 ring-blue-500/50 bg-slate-800 scale-[1.02]' 
                                                        : 'border-slate-800 bg-slate-900/80 opacity-85 hover:opacity-100 hover:border-slate-700'
                                                }`}
                                            >
                                                <img src={p.processedSrc || p.rawSrc} alt={p.name} className="w-full h-full object-cover" />
                                                
                                                <div className="absolute top-2 left-2 px-2 py-0.5 bg-blue-600/90 text-white font-mono text-xs font-bold rounded-md shadow-md border border-blue-400/30">
                                                    #{idx + 1}
                                                </div>

                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleRemovePage(idx);
                                                    }}
                                                    className="absolute top-2 right-2 p-1 bg-red-600/80 hover:bg-red-600 text-white rounded-lg opacity-0 group-hover:opacity-100 transition shadow-md"
                                                    title="이 페이지 삭제"
                                                >
                                                    <Icon name="x" className="w-3.5 h-3.5" />
                                                </button>

                                                <div className="absolute bottom-0 inset-x-0 bg-slate-950/90 backdrop-blur-sm p-1.5 text-[10px] text-slate-300 font-mono truncate text-center border-t border-slate-800">
                                                    {p.name}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Image Preprocessing Adjustments */}
                            {pages.length > 0 && pages[selectedPageIndex] && (
                                <div className="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                                    <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                                        <h3 className="text-xs font-semibold text-slate-200 flex items-center space-x-2">
                                            <Icon name="sliders" className="w-4 h-4 text-blue-400" />
                                            <span>선택 페이지 보정 (#{selectedPageIndex + 1})</span>
                                        </h3>
                                        <button
                                            onClick={() => setFilters({ rotation: 0, brightness: 0, contrast: 20, grayscale: false })}
                                            className="text-[11px] text-slate-400 hover:text-slate-200 underline"
                                        >
                                            초기화
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <div className="flex justify-between text-slate-400 mb-1">
                                                <span>선명도/대비</span>
                                                <span>+{filters.contrast}%</span>
                                            </div>
                                            <input 
                                                type="range" min="0" max="100" 
                                                value={filters.contrast} 
                                                onChange={(e) => setFilters(f => ({ ...f, contrast: e.target.value }))}
                                                className="w-full accent-blue-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
                                            />
                                        </div>

                                        <div>
                                            <div className="flex justify-between text-slate-400 mb-1">
                                                <span>밝기</span>
                                                <span>{filters.brightness}%</span>
                                            </div>
                                            <input 
                                                type="range" min="-50" max="50" 
                                                value={filters.brightness} 
                                                onChange={(e) => setFilters(f => ({ ...f, brightness: e.target.value }))}
                                                className="w-full accent-blue-500 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between pt-1">
                                        <button
                                            onClick={() => setFilters(f => ({ ...f, rotation: (f.rotation + 90) % 360 }))}
                                            className="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl flex items-center space-x-1.5 transition"
                                        >
                                            <Icon name="rotate-cw" className="w-3.5 h-3.5" />
                                            <span>90도 회전 ({filters.rotation}°)</span>
                                        </button>

                                        <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={filters.grayscale} 
                                                onChange={(e) => setFilters(f => ({ ...f, grayscale: e.target.checked }))}
                                                className="accent-blue-500 rounded"
                                            />
                                            <span>흑백 강조 강화</span>
                                        </label>
                                    </div>
                                </div>
                            )}

                            {/* Mode Options */}
                            <div className="glass-panel p-4 rounded-2xl border border-slate-800 space-y-4">
                                <h3 className="text-xs font-semibold text-slate-200 flex items-center space-x-2">
                                    <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                                    <span>OCR 스캔 옵션 설정</span>
                                </h3>

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    {[
                                        { id: 'markdown', label: '마크다운 구조', icon: 'file-text', desc: '본문 + 표 보존' },
                                        { id: 'plain', label: '일반 텍스트', icon: 'align-left', desc: '순수 글자' },
                                        { id: 'table', label: '표/데이터 표', icon: 'table', desc: '표 추출' },
                                        { id: 'translate', label: '텍스트 + 번역', icon: 'languages', desc: '언어 번역' },
                                        { id: 'keyvalue', label: '영수증/JSON', icon: 'receipt', desc: 'JSON 추출' },
                                        { id: 'handwriting', label: '손글씨/복잡 문서', icon: 'pen-tool', desc: '고난도 인식' }
                                    ].map(mode => (
                                        <button
                                            key={mode.id}
                                            onClick={() => setOcrMode(mode.id)}
                                            className={`p-2.5 rounded-xl border text-left flex flex-col justify-between transition ${
                                                ocrMode === mode.id 
                                                    ? 'bg-blue-600/20 border-blue-500 text-blue-200 ring-1 ring-blue-500/40' 
                                                    : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                            }`}
                                        >
                                            <div className="flex items-center space-x-1.5 mb-1">
                                                <Icon name={mode.icon} className="w-3.5 h-3.5 text-blue-400" />
                                                <span className="text-xs font-medium">{mode.label}</span>
                                            </div>
                                            <span className="text-[10px] text-slate-500">{mode.desc}</span>
                                        </button>
                                    ))}
                                </div>

                                {ocrMode === 'translate' && (
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">번역 대상 언어</label>
                                        <select 
                                            value={targetLang}
                                            onChange={(e) => setTargetLang(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none"
                                        >
                                            <option value="Korean">한국어 (Korean)</option>
                                            <option value="English">영어 (English)</option>
                                            <option value="Japanese">일본어 (Japanese)</option>
                                            <option value="Chinese">중국어 (Chinese)</option>
                                        </select>
                                    </div>
                                )}

                                {/* Book Scan Checkboxes */}
                                <div className="space-y-2 pt-2 border-t border-slate-800">
                                    <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={removeBookHeaderFooter} 
                                            onChange={(e) => setRemoveBookHeaderFooter(e.target.checked)}
                                            className="accent-blue-500 rounded"
                                        />
                                        <span>책 상단 헤더, 하단 여백 문구 제외 (본문만 추출)</span>
                                    </label>

                                    <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={includePageDelimiter} 
                                            onChange={(e) => setIncludePageDelimiter(e.target.checked)}
                                            className="accent-blue-500 rounded"
                                        />
                                        <span>이미지에 실제 인쇄된 페이지 번호가 감지될 때만 &lt;page X&gt; 구분자 표시</span>
                                    </label>

                                    {ocrEngine === 'gemini' && (
                                        <label className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={fallbackToTesseract} 
                                                onChange={(e) => setFallbackToTesseract(e.target.checked)}
                                                className="accent-blue-500 rounded"
                                            />
                                            <span>Gemini가 정책(RECITATION)으로 차단한 페이지는 로컬 Tesseract로 인식</span>
                                        </label>
                                    )}
                                </div>

                                <div>
                                    <label className="text-xs text-slate-400 block mb-1">추가 지시사항 (선택)</label>
                                    <input 
                                        type="text"
                                        placeholder="예: 특정 항목 강조, 주석 제외 등..."
                                        value={customInstruction}
                                        onChange={(e) => setCustomInstruction(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none focus:border-blue-500"
                                    />
                                </div>

                                {/* Run OCR Button */}
                                <button
                                    onClick={handleStartBatchOCR}
                                    disabled={isLoading || pages.length === 0}
                                    className={`w-full py-3 px-4 rounded-xl font-medium text-xs flex items-center justify-center space-x-2 shadow-lg transition-all ${
                                        isLoading || pages.length === 0
                                            ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                                            : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-blue-500/25 active:scale-[0.99]'
                                    }`}
                                >
                                    <Icon name="sparkles" className="w-4 h-4" />
                                    <span>
                                        {isLoading 
                                            ? `스캔 중... (${progressStatus.current} / ${progressStatus.total} 페이지) - ${progressStatus.detail}` 
                                            : `[${ocrEngine.toUpperCase()} 엔진] 총 ${pages.length}개 페이지 연속 스캔 시작`}
                                    </span>
                                </button>
                            </div>
                        </div>

                        {/* RIGHT PANEL: Output Viewport & Controls & AI Chatbot */}
                        <div className="lg:col-span-7 flex flex-col space-y-4">
                            
                            <div className="glass-panel rounded-2xl border border-slate-800 p-4 flex-grow flex flex-col shadow-2xl min-h-[550px]">
                                
                                {/* Output Header Controls */}
                                <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800">
                                    <div className="flex items-center space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                                        {[
                                            { id: 'formatted', label: '서식 뷰어', icon: 'eye' },
                                            { id: 'raw', label: '원본 마크다운', icon: 'code' },
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setActiveResultTab(tab.id)}
                                                className={`px-3 py-1.5 text-xs font-medium rounded-lg flex items-center space-x-1.5 transition ${
                                                    activeResultTab === tab.id 
                                                        ? 'bg-blue-600 text-white shadow-md' 
                                                        : 'text-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                <Icon name={tab.icon} className="w-3.5 h-3.5" />
                                                <span>{tab.label}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center space-x-2">
                                        <button
                                            onClick={handleToggleTTS}
                                            disabled={!ocrResult}
                                            className={`p-2 rounded-xl border transition text-xs flex items-center space-x-1 ${
                                                isSpeaking 
                                                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse' 
                                                    : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'
                                            }`}
                                            title="음성으로 읽기"
                                        >
                                            <Icon name={isSpeaking ? 'volume-x' : 'volume-2'} className="w-4 h-4" />
                                        </button>

                                        <button
                                            onClick={handleCopyText}
                                            disabled={!ocrResult}
                                            className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl text-xs flex items-center space-x-1.5 transition"
                                        >
                                            <Icon name="copy" className="w-3.5 h-3.5" />
                                            <span>복사</span>
                                        </button>

                                        <div className="flex items-center space-x-1">
                                            <button
                                                onClick={() => handleDownload('txt')}
                                                disabled={!ocrResult}
                                                className="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl text-xs transition"
                                            >
                                                .TXT
                                            </button>
                                            <button
                                                onClick={() => handleDownload('md')}
                                                disabled={!ocrResult}
                                                className="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl text-xs transition"
                                            >
                                                .MD
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Text Viewport Area */}
                                <div className="flex-grow my-3 bg-slate-950/60 rounded-xl p-4 border border-slate-900 overflow-y-auto max-h-[600px] scrollbar-thin">
                                    {isLoading && !ocrResult && (
                                        <div className="h-full flex flex-col items-center justify-center py-20 text-slate-500 space-y-3">
                                            <div className="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                                            <p className="text-xs">문서를 스캔하고 있습니다... ({progressStatus.detail})</p>
                                        </div>
                                    )}

                                    {!isLoading && !ocrResult && (
                                        <div className="h-full flex flex-col items-center justify-center py-24 text-slate-500 space-y-3">
                                            <Icon name="file-search" className="w-10 h-10 text-slate-700" />
                                            <p className="text-xs">왼쪽에서 이미지를 업로드 후 스캔을 시작하세요.</p>
                                        </div>
                                    )}

                                    {ocrResult && activeResultTab === 'formatted' && (
                                        <div 
                                            className="prose prose-invert max-w-none text-xs leading-relaxed text-slate-200 space-y-3"
                                            dangerouslySetInnerHTML={{ __html: renderMarkdownSafely(ocrResult) }}
                                        />
                                    )}

                                    {ocrResult && activeResultTab === 'raw' && (
                                        <textarea
                                            readOnly
                                            value={ocrResult}
                                            className="w-full h-full min-h-[450px] bg-transparent text-xs font-mono text-slate-300 outline-none resize-none"
                                        />
                                    )}
                                </div>

                                {/* AI Document Chatbot */}
                                {ocrResult && (
                                    <div className="border-t border-slate-800/80 pt-3 mt-auto">
                                        <div className="flex items-center space-x-2 mb-2">
                                            <Icon name="bot" className="w-4 h-4 text-blue-400" />
                                            <span className="text-xs font-medium text-slate-300">추출된 문서 기반 AI 질문하기</span>
                                        </div>

                                        {chatMessages.length > 0 && (
                                            <div className="max-h-36 overflow-y-auto mb-2 space-y-2 p-2 bg-slate-900/60 rounded-xl border border-slate-800 text-xs">
                                                {chatMessages.map((msg, i) => (
                                                    <div key={i} className={`p-2 rounded-lg ${msg.role === 'user' ? 'bg-blue-600/20 text-blue-200 text-right ml-8' : 'bg-slate-800 text-slate-200 mr-8'}`}>
                                                        {msg.content}
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex space-x-2">
                                            <input 
                                                type="text"
                                                placeholder="문서 내용에 대해 질문하세요 (예: 요약해줘, 주요 키워드는?)"
                                                value={chatInput}
                                                onChange={(e) => setChatInput(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleSendChatMessage()}
                                                className="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-200 outline-none focus:border-blue-500"
                                            />
                                            <button
                                                onClick={handleSendChatMessage}
                                                disabled={isChatLoading}
                                                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium flex items-center space-x-1 transition shadow-md"
                                            >
                                                <Icon name="send" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    {/* History Drawer */}
                    {isHistoryOpen && (
                        <div className="fixed inset-y-0 right-0 z-50 w-80 bg-slate-900 border-l border-slate-800 p-4 shadow-2xl flex flex-col">
                            <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                                <h3 className="font-semibold text-xs text-slate-200 flex items-center space-x-1.5">
                                    <Icon name="history" className="w-4 h-4 text-blue-400" />
                                    <span>이전 스캔 기록</span>
                                </h3>
                                <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-white">
                                    <Icon name="x" className="w-4 h-4" />
                                </button>
                            </div>

                            <div className="flex-grow overflow-y-auto space-y-2">
                                {history.length === 0 ? (
                                    <p className="text-xs text-slate-500 text-center py-8">저장된 기록이 없습니다.</p>
                                ) : (
                                    history.map(item => (
                                        <div 
                                            key={item.id}
                                            onClick={() => {
                                                setOcrResult(item.result);
                                                setIsHistoryOpen(false);
                                                showToast('이전 기록을 불러왔습니다.', 'info');
                                            }}
                                            className="p-3 bg-slate-950/80 hover:bg-slate-800 border border-slate-800/80 rounded-xl cursor-pointer transition space-y-1"
                                        >
                                            <div className="text-xs font-medium text-slate-200 truncate">{item.title}</div>
                                            <div className="text-[10px] text-slate-500 font-mono">{item.timestamp}</div>
                                            <p className="text-[11px] text-slate-400 line-clamp-2">{item.snippet}</p>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        window.onload = function() {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        };
    </script>
</body>
</html>
