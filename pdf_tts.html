<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Reader · TTS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bar: #1e2124;
    --bar-2: #25292d;
    --fg: #e8eaed;
    --dim: #9aa0a6;
    --btn: #33383d;
    --btn-border: #4a5056;
    --accent: #3b82f6;
    --desk: #525659;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
    background: var(--desk); color: var(--fg);
  }

  /* ===== 상단 크롬: 리더 바 + TTS 바 ===== */
  #chrome {
    position: sticky; top: 0; z-index: 100;
    background: var(--bar); box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 12px; }
  #tts-bar { background: var(--bar-2); border-top: 1px solid #333a40; }
  .group { display: flex; align-items: center; gap: 6px; }
  button, .btn, select, input[type="text"] {
    font: inherit; font-size: 14px; color: var(--fg);
    background: var(--btn); border: 1px solid var(--btn-border); border-radius: 6px;
    padding: 6px 11px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled), .btn:hover { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); min-width: 104px; }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  select { padding: 6px 8px; max-width: 220px; }
  label.field, label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); white-space: nowrap; }
  label.chk { cursor: pointer; }
  input[type="file"] { display: none; }

  #doc-name { max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--dim); }
  .pager input {
    width: 54px; text-align: center; cursor: text; background: #15181a; padding: 6px 4px;
  }
  .pager input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  #page-total { font-size: 14px; color: var(--dim); min-width: 44px; }
  #zoom-eff { font-size: 12px; color: var(--dim); min-width: 40px; }
  #status { flex: 1 1 260px; min-width: 200px; font-size: 13px; color: var(--dim); }
  #status.err { color: #ff8a80; }
  #progress { height: 3px; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  /* ===== 페이지 ===== */
  #pdf-container { display: grid; justify-content: safe center; gap: 14px; padding: 14px 12px 60px; }
  .page { position: relative; background: #fff; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .page canvas { display: block; }

  /* 하이라이트 레이어(글자 아래)와 선택용 텍스트 레이어(글자 위) */
  .hl, .tl { position: absolute; inset: 0; }
  .hl { pointer-events: none; }
  .w, .hv { position: absolute; border-radius: 3px; mix-blend-mode: multiply; }
  .hv { background: rgba(59,130,246,.28); display: none; }
  .w.sent { background: rgba(255,226,60,.40); }
  .w.active { background: rgba(255,196,0,.85); box-shadow: 0 0 0 1px rgba(230,140,0,.95); }
  .ti { position: absolute; white-space: pre; line-height: 1; color: transparent; transform-origin: 0 0; cursor: inherit; }
  .ti::selection { background: rgba(59,130,246,.35); color: transparent; }

  body.dragging::after {
    content: "PDF를 여기에 놓으세요"; position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center; font-size: 28px;
    background: rgba(30,33,36,.85); border: 3px dashed var(--accent);
  }
  @media (max-width: 700px) {
    button, .btn, select, input[type="text"] { padding: 5px 8px; font-size: 13px; }
    .bar { gap: 6px 8px; padding: 5px 8px; }
    select { max-width: 140px; }
    #doc-name { display: none; }
    label.chk { white-space: normal; max-width: 150px; line-height: 1.2; }
    #status { flex-basis: 100%; font-size: 12px; }
  }
</style>
</head>
<body>

<header id="chrome">
  <div class="bar" id="reader-bar">
    <div class="group">
      <label class="btn" for="pdf-input">📂 열기</label>
      <input type="file" id="pdf-input" accept="application/pdf,.pdf">
      <span id="doc-name"></span>
    </div>

    <div class="group pager" title="번호를 입력하고 Enter 를 누르면 해당 쪽으로 이동합니다 (단축키: G)">
      <button id="btn-pg-prev" aria-label="이전 쪽" disabled>▲</button>
      <input type="text" id="page-input" inputmode="numeric" autocomplete="off" aria-label="현재 쪽" value="" disabled>
      <span id="page-total">/ –</span>
      <button id="btn-pg-next" aria-label="다음 쪽" disabled>▼</button>
    </div>

    <div class="group">
      <button id="btn-zoom-out" title="축소" aria-label="축소" disabled>−</button>
      <select id="zoom-select" aria-label="배율">
        <option value="width">너비 맞춤</option>
        <option value="page">쪽 맞춤</option>
        <option value="50">50%</option><option value="75">75%</option><option value="100">100%</option>
        <option value="125">125%</option><option value="150">150%</option><option value="200">200%</option>
        <option value="300">300%</option>
      </select>
      <button id="btn-zoom-in" title="확대" aria-label="확대" disabled>+</button>
      <span id="zoom-eff"></span>
    </div>
  </div>

  <div class="bar" id="tts-bar">
    <div class="group">
      <button id="btn-prev" title="이전 문장 (←)" aria-label="이전 문장" disabled>⏮</button>
      <button id="btn-play" class="primary" title="재생/일시정지 (Space)" disabled>▶ 재생</button>
      <button id="btn-stop" title="정지 (Esc)" aria-label="정지" disabled>⏹</button>
      <button id="btn-next" title="다음 문장 (→)" aria-label="다음 문장" disabled>⏭</button>
      <button id="btn-locate" title="지금 읽는 위치로 이동" aria-label="읽는 위치로 이동" disabled>📍</button>
    </div>
    <div class="group">
      <label class="field">속도
        <select id="select-rate">
          <option value="0.6">0.6x</option><option value="0.8">0.8x</option>
          <option value="1" selected>1.0x</option><option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2.0x</option>
        </select>
      </label>
      <label class="field">음성
        <select id="select-voice"><option value="auto">자동 (영어)</option></select>
      </label>
      <label class="chk" title="페이지 위·아래의 머리글, 바닥글, 쪽번호를 읽지 않습니다">
        <input type="checkbox" id="chk-edges" checked> 머리글·쪽번호 제외
      </label>
    </div>
    <div id="status" role="status" aria-live="polite">PDF 파일을 열거나 이 창에 끌어다 놓으세요.</div>
  </div>
  <div id="progress"><i></i></div>
</header>

<main id="pdf-container"></main>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const els = {
  chrome: $('chrome'), input: $('pdf-input'), docName: $('doc-name'),
  pgPrev: $('btn-pg-prev'), pgNext: $('btn-pg-next'), pageInput: $('page-input'), pageTotal: $('page-total'),
  zoomIn: $('btn-zoom-in'), zoomOut: $('btn-zoom-out'), zoomSel: $('zoom-select'), zoomEff: $('zoom-eff'),
  prev: $('btn-prev'), play: $('btn-play'), stop: $('btn-stop'), next: $('btn-next'), locate: $('btn-locate'),
  rate: $('select-rate'), voice: $('select-voice'), edges: $('chk-edges'),
  status: $('status'), progress: $('progress').firstElementChild, container: $('pdf-container'),
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('pdftts.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pdftts.' + k, v); } catch {} },
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const chromeH = () => els.chrome.offsetHeight;

function setStatus(msg, isErr) {
  if (els.status.textContent !== msg) els.status.textContent = msg;
  els.status.classList.toggle('err', !!isErr);
}

if (typeof pdfjsLib === 'undefined') {
  setStatus('PDF.js를 불러오지 못했습니다. 네트워크 연결을 확인하세요.', true);
  return;
}
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const synth = window.speechSynthesis;
if (!synth) setStatus('이 브라우저는 음성 합성(Web Speech API)을 지원하지 않습니다.', true);

/* =====================================================================
 * 1. 문서 모델
 *    tokens : 문서 전체 단어 목록. el 은 해당 쪽이 화면에 렌더링되어 있을 때만
 *             채워지는 하이라이트 박스(div)
 *    pages  : 쪽별 레이아웃/렌더 상태. boxes 는 토큰별 단어 위치(쪽 크기 대비 비율)
 * ===================================================================== */
let pdfDoc = null;
let loadId = 0;
let tokens = [];
let sentStarts = [];
const pages = [];
const measureCtx = document.createElement('canvas').getContext('2d');

const PAGENO_RE = /^(?:[-–—]\s*)?(?:page\s*|p\.\s*)?\d{1,4}(?:\s*(?:\/|of)\s*\d{1,4})?(?:\s*[-–—])?$/i;
const HY_RE = /^[-\u2010\u00AD]$/;
const BULLET_RE = /^[•●○◦■□▪▫◆◇★☆▶►▷·※✓✔]+$/;
const END_RE = /[.!?…]["'”’)\]]*$/;
const ABBR_RE = /^(?:[A-Za-z]|Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|e\.g|i\.e|Fig|Eq|Vol|pp|cf|al)\.$/i;

function isSentenceEnd(t) {
  if (t.para) return true;
  const s = t.speak;
  if (!END_RE.test(s)) return false;
  const bare = s.replace(/["'”’)\]]+$/, '');
  if (/\.$/.test(bare) && (ABBR_RE.test(bare) || /^\d+\.$/.test(bare))) return false;
  return true;
}

/* 텍스트 추출: item 사이의 공백/줄바꿈/문단/하이픈을 복원해 토큰 생성 */
function extractPage(pi, tc, vp) {
  const list = [];
  for (const raw of tc.items) {
    if (typeof raw.str !== 'string') continue;
    const tx = pdfjsLib.Util.transform(vp.transform, raw.transform);
    const fh = Math.hypot(tx[2], tx[3]) || 1;
    list.push({
      raw, x: tx[4], y: tx[5], fh,
      w: raw.width > 0 ? raw.width * vp.scale : raw.str.length * fh * 0.5,
      blank: raw.str.trim() === '',
    });
  }

  // 줄 간격 중앙값: 이중 간격 문서에서 모든 줄이 문단으로 잘못 나뉘는 것을 막는다
  const dys = [];
  let ly = null;
  for (const g of list) {
    if (g.blank) continue;
    if (ly !== null && Math.abs(g.y - ly) > g.fh * 0.5) dys.push(Math.abs(g.y - ly));
    ly = g.y;
  }
  dys.sort((a, b) => a - b);
  const med = dys.length >= 3 ? dys[dys.length >> 1] : 0;

  const items = [];
  const first = tokens.length;
  let lastTok = tokens.length ? tokens[tokens.length - 1] : null;
  if (lastTok && lastTok.sep === '') lastTok.sep = ' ';
  let prev = null, line = null;

  for (const g of list) {
    const s = g.raw.str;
    if (g.blank) {
      if (lastTok && lastTok.sep === '') lastTok.sep = ' ';
      if (g.raw.hasEOL && prev) prev.eol = true;
      continue;
    }

    const best = Math.max(g.fh, prev ? prev.fh : 0);
    const sameLine = !!prev && Math.abs(g.y - prev.y) <= best * 0.5;
    if (lastTok && lastTok.sep === '' && /^\s/.test(s)) lastTok.sep = ' ';

    if (prev && lastTok) {
      if (sameLine) {
        const gap = g.x - (prev.x + prev.w);
        if (lastTok.sep === '' && (prev.eol || gap > best * 0.15 || gap < -best * 2)) lastTok.sep = ' ';
      } else {
        const dy = Math.abs(g.y - prev.y);
        const lf = line ? line.fh : prev.fh;
        const ref = med || lf * 1.3;
        const para = dy > ref * 1.5 || Math.abs(g.fh - lf) > lf * 0.15;
        if (lastTok.sep === '') {
          // 하이픈이 별도 item 으로 분리된 경우("word" + "-")와 한 token 에 붙은 경우("word-")를 모두 처리
          const hyOnly = HY_RE.test(lastTok.text);
          const before = hyOnly && tokens.length > 1 ? tokens[tokens.length - 2] : null;
          const hyphenated = hyOnly
            ? !!before && before.p === lastTok.p && before.sep === '' && /\p{L}$/u.test(before.text)
            : /\p{L}[-\u2010\u00AD]$/u.test(lastTok.text);
          if (!para && hyphenated && /^[a-zß-ÿ]/.test(s)) {
            lastTok.speak = lastTok.text.replace(/[-\u2010\u00AD]+$/, '');  // 줄 끝 하이픈 → 단어 이어붙임
            lastTok.joined = true;
            if (hyOnly) before.joined = true;
          } else {
            lastTok.sep = ' ';
          }
        }
        if (para) lastTok.para = true;
      }
    }
    if (!prev || !sameLine) line = { fh: g.fh, len: s.length };
    else if (s.length > line.len) { line.fh = g.fh; line.len = s.length; }

    const item = {
      str: s, transform: g.raw.transform, width: g.raw.width, height: g.raw.height,
      fontName: g.raw.fontName, toks: [], yv: g.y / vp.height,
    };
    const idx = items.push(item) - 1;

    let off = 0;
    for (const part of s.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s/.test(part)) {
        if (item.toks.length) tokens[item.toks[item.toks.length - 1]].sep = ' ';
        off += part.length;
        continue;
      }
      const speak = part.replace(/[\u00AD\u200B-\u200D\uFEFF]/g, '').replace(BULLET_RE, '');
      const t = {
        p: pi, it: idx, s: off, e: off + part.length, text: part, speak,
        sep: '', para: false, joined: false, edge: false, end: false, el: null,
      };
      item.toks.push(tokens.push(t) - 1);
      lastTok = t;
      off += part.length;
    }
    prev = { x: g.x, y: g.y, w: g.w, fh: g.fh, eol: !!g.raw.hasEOL };
  }
  return { items, first, last: tokens.length };
}

/* 머리글/바닥글/쪽번호: 여러 쪽에 반복되는 가장자리 텍스트 + 가장자리의 단독 쪽번호 */
function markEdges() {
  const N = pages.length;
  const zone = it => it.yv < 0.15 || it.yv > 0.85;
  const keyOf = it => it.str.trim().replace(/\d+/g, '#') + '|' + Math.round(it.yv * 40);
  const counts = new Map();
  for (const p of pages) {
    const seen = new Set();
    for (const it of p.items) {
      if (!zone(it)) continue;
      const k = keyOf(it);
      if (!seen.has(k)) { seen.add(k); counts.set(k, (counts.get(k) || 0) + 1); }
    }
  }
  const minCount = Math.max(2, Math.ceil(N * 0.4));
  for (const p of pages) {
    for (const it of p.items) {
      if (!zone(it)) continue;
      const repeated = N >= 2 && counts.get(keyOf(it)) >= minCount;
      const pageNo = (it.yv < 0.1 || it.yv > 0.9) && PAGENO_RE.test(it.str.trim());
      if (repeated || pageNo) for (const ti of it.toks) tokens[ti].edge = true;
    }
  }
}

function computeSentences() {
  sentStarts = [];
  let startNext = true;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    t.end = isSentenceEnd(t);
    if (startNext) { sentStarts.push(i); startNext = false; }
    if (t.end) startNext = true;
  }
}

function floorIndex(arr, x) {
  let lo = 0, hi = arr.length - 1, r = 0;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (arr[m] <= x) { r = m; lo = m + 1; } else hi = m - 1;
  }
  return r;
}

/* =====================================================================
 * 2. 단어 위치 분석
 *    PDF 가 알려주는 글자 폭/위치는 PDF 마다 크게 다르다(특히 스캔+OCR, 대체 글꼴).
 *    그래서 쪽을 실제로 그려 본 픽셀에서 단어의 잉크 위치를 직접 찾는다.
 *      - 같은 줄의 토큰 수 == 잉크 덩어리 수 → 단어별로 정확히 대응
 *      - 대응이 안 되면 → 줄 전체의 잉크 범위에 맞춰 추정 위치를 보정
 * ===================================================================== */
const ANALYSIS_W = 1600;
const GAP_TRIES = [0.14, 0.18, 0.11, 0.22, 0.09, 0.27];   // 단어 사이 간격(글자 높이 대비)
const DY_TRIES = [0, -0.18, 0.18, -0.35, 0.35];            // 텍스트 레이어가 세로로 어긋난 경우 대비

function inkColumns(d, W, x0, x1, y0, y1) {
  const n = x1 - x0;
  const hist = new Uint32Array(16);
  for (let y = y0; y < y1; y += 2) {
    let i = (y * W + x0) * 4;
    for (let x = 0; x < n; x++, i += 4) hist[(((d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10) | 0) >> 4]++;
  }
  let mode = 0;
  for (let k = 1; k < 16; k++) if (hist[k] > hist[mode]) mode = k;
  const bg = mode * 16 + 8;
  const cols = new Uint8Array(n);
  for (let y = y0; y < y1; y++) {
    let i = (y * W + x0) * 4;
    for (let x = 0; x < n; x++, i += 4) {
      if (cols[x]) continue;
      const l = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10;
      if (l - bg > 55 || bg - l > 55) cols[x] = 1;
    }
  }
  return cols;
}

function inkRuns(cols, x0) {
  const runs = [];
  let a = -1;
  for (let x = 0; x < cols.length; x++) {
    if (cols[x]) { if (a < 0) a = x; }
    else if (a >= 0) { runs.push([x0 + a, x0 + x - 1]); a = -1; }
  }
  if (a >= 0) runs.push([x0 + a, x0 + cols.length - 1]);
  return runs;
}

function mergeRuns(runs, thr) {
  const out = [];
  for (const r of runs) {
    const last = out[out.length - 1];
    if (last && r[0] - last[1] - 1 < thr) last[1] = r[1];
    else out.push([r[0], r[1]]);
  }
  return out;
}

async function analyzePage(p, page) {
  const sA = ANALYSIS_W / p.base.w;
  const vp = page.getViewport({ scale: sA });
  const W = Math.floor(vp.width), H = Math.floor(vp.height);
  let data = null;
  try {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { alpha: false, willReadFrequently: true });
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    data = ctx.getImageData(0, 0, W, H).data;
  } catch (e) { data = null; }

  const boxes = new Array(p.tokEnd - p.tokStart).fill(null);

  // item 기하 정보 (분석 해상도 기준)
  const ents = [];
  for (const item of p.items) {
    if (!item.toks.length) continue;
    const style = p.styles[item.fontName] || {};
    const tx = pdfjsLib.Util.transform(vp.transform, item.transform);
    const fh = Math.hypot(tx[2], tx[3]) || 1;
    if (style.vertical || Math.abs(tx[1]) > fh * 0.02 || Math.abs(tx[2]) > fh * 0.02) continue;  // 회전/세로 글자는 제외
    ents.push({ item, family: style.fontFamily || 'sans-serif', fh, x: tx[4], yb: tx[5], w: item.width * sA });
  }

  // 같은 기준선의 item 을 한 줄로 묶는다
  ents.sort((a, b) => a.yb - b.yb);
  const rows = [];
  for (const e of ents) {
    const r = rows[rows.length - 1];
    if (r && Math.abs(e.yb - r.yb) <= 0.35 * Math.max(e.fh, r.fh)) {
      r.ents.push(e);
      if (e.item.toks.length > r.best.item.toks.length) r.best = e;
    } else {
      rows.push({ ents: [e], best: e, yb: e.yb, fh: e.fh });
    }
  }

  let lastFont = '';
  const measure = (str, fh, family) => {
    const f = `${fh}px ${family}`;
    if (f !== lastFont) { measureCtx.font = f; lastFont = f; }
    return measureCtx.measureText(str).width;
  };

  for (const r of rows) {
    r.ents.sort((a, b) => a.x - b.x);
    const fh = r.best.fh, yb = r.best.yb;
    const all = [];
    for (const e of r.ents) for (const ti of e.item.toks) all.push({ ti, e });
    // 하이픈만 따로 떨어진 토큰은 앞 단어와 같은 잉크 덩어리
    const vis = all.filter((t, i) => !(i > 0 && HY_RE.test(tokens[t.ti].text) && tokens[all[i - 1].ti].sep === ''));
    if (!vis.length) continue;

    const minX = Math.min(...r.ents.map(e => e.x));
    const maxR = Math.max(...r.ents.map(e => e.x + e.w));
    const x0 = clamp(Math.floor(minX - 2 * fh), 0, W - 1);
    const x1 = clamp(Math.ceil(maxR + 0.3 * (maxR - minX) + 2 * fh), x0 + 1, W);

    let words = null, usedDy = 0, ink0 = null;
    if (data) {
      for (const dyk of DY_TRIES) {
        const y0 = clamp(Math.round(yb + dyk * fh - 0.78 * fh), 0, H - 1);
        const y1 = clamp(Math.round(yb + dyk * fh + 0.24 * fh), y0 + 1, H);
        const runs = inkRuns(inkColumns(data, W, x0, x1, y0, y1), x0);
        if (dyk === 0 && runs.length) ink0 = [runs[0][0], runs[runs.length - 1][1]];
        if (!runs.length) continue;
        for (const k of GAP_TRIES) {
          const w = mergeRuns(runs, k * fh);
          if (w.length === vis.length) { words = w; break; }
        }
        if (words) { usedDy = dyk; break; }
      }
    }

    const yTop = yb + usedDy * fh - 0.8 * fh, bh = 1.04 * fh, base = yb + usedDy * fh;
    const put = (ti, x, w) => {
      boxes[ti - p.tokStart] = { x: (x - 1) / W, w: (w + 2) / W, y: yTop / H, h: bh / H, b: base / H, f: fh / W };
    };

    if (words) {
      let wi = 0, prevBox = null;
      for (let i = 0; i < all.length; i++) {
        const t = all[i];
        if (i > 0 && HY_RE.test(tokens[t.ti].text) && tokens[all[i - 1].ti].sep === '') {
          boxes[t.ti - p.tokStart] = prevBox;       // 앞 단어의 박스를 공유
          continue;
        }
        const [a, b] = words[wi++];
        put(t.ti, a, b - a + 1);
        prevBox = boxes[t.ti - p.tokStart];
      }
      continue;
    }

    // 폴백: item 기하로 추정한 뒤, 줄 전체의 잉크 범위에 맞춰 보정
    const est = all.map(t => {
      const e = t.e, tk = tokens[t.ti];
      const full = measure(e.item.str, e.fh, e.family);
      const sx = e.item.width > 0 && full > 0 ? (e.item.width * sA) / full : 1;
      return {
        ti: t.ti,
        x: e.x + measure(e.item.str.slice(0, tk.s), e.fh, e.family) * sx,
        w: measure(tk.text, e.fh, e.family) * sx,
      };
    });
    let eMin = Infinity, eMax = -Infinity;
    for (const t of est) { eMin = Math.min(eMin, t.x); eMax = Math.max(eMax, t.x + t.w); }
    let scale = 1, shift = 0;
    if (ink0 && eMax > eMin) {
      const ratio = (ink0[1] - ink0[0]) / (eMax - eMin);
      if (ratio > 0.6 && ratio < 1.6) { scale = ratio; shift = ink0[0] - eMin * scale; }
    }
    for (const t of est) put(t.ti, t.x * scale + shift, t.w * scale);
  }
  return boxes;
}

/* =====================================================================
 * 3. 렌더링 (지연 렌더 + 하이라이트/텍스트 레이어)
 * ===================================================================== */
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const p = e.target._page;
    p.want = e.isIntersecting;
    if (p.want) renderPage(p); else unrenderPage(p);
  }
}, { rootMargin: '1500px 0px' });

let zoomMode = store.get('zoomMode', 'width');          // width | page | pct
let zoomPct = +store.get('zoomPct', 100) || 100;
const ZOOM_PRESETS = [50, 75, 100, 125, 150, 200, 300];
const PT_TO_PX = 96 / 72;

function pageScale(p) {
  const availW = Math.max(200, els.container.clientWidth - 24);
  if (zoomMode === 'pct') return zoomPct / 100 * PT_TO_PX;
  const byW = Math.min(availW, 1200) / p.base.w;
  if (zoomMode === 'page') {
    const availH = Math.max(200, window.innerHeight - chromeH() - 28);
    return Math.max(0.1, Math.min(byW, availH / p.base.h));
  }
  return Math.max(0.1, byW);
}

function sizeWrapper(p) {
  p.scale = pageScale(p);
  p.wrapper.style.width = Math.floor(p.base.w * p.scale) + 'px';
  p.wrapper.style.height = Math.floor(p.base.h * p.scale) + 'px';
}

async function renderPage(p) {
  if (p.rendered || p.rendering || !pdfDoc) return;
  const myLoad = loadId, g = ++p.gen;
  const stale = () => myLoad !== loadId || g !== p.gen;
  p.rendering = true;
  try {
    const page = await pdfDoc.getPage(p.n);
    if (stale()) return;
    const vp = page.getViewport({ scale: p.scale });
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = Math.floor(vp.width) + 'px';
    canvas.style.height = Math.floor(vp.height) + 'px';
    p.task = page.render({
      canvasContext: canvas.getContext('2d', { alpha: false }),
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
    });
    await p.task.promise;
    if (stale()) return;

    p.wrapper.replaceChildren(canvas);       // 그림을 먼저 보여 주고
    p.rendered = true;
    if (!p.boxes) {                          // 단어 위치 분석은 쪽당 한 번만
      const b = await analyzePage(p, page);
      if (!p.boxes) p.boxes = b;
      if (stale()) return;
    }
    buildLayers(p, vp);
    if (active >= 0) applyHighlight(pendingScroll);
  } catch (e) {
    if (!e || e.name !== 'RenderingCancelledException') console.error('render error', e);
  } finally {
    p.rendering = false;
    p.task = null;
    if (p.want && !p.rendered && myLoad === loadId) renderPage(p);
  }
}

function unrenderPage(p) {
  p.gen++;
  if (p.task) { try { p.task.cancel(); } catch {} }
  if (!p.rendered) return;
  for (let i = p.tokStart; i < p.tokEnd; i++) tokens[i].el = null;
  p.wrapper.replaceChildren();
  p.hv = null;
  p.rendered = false;
}

function buildLayers(p, vp) {
  const VW = vp.width, VH = vp.height;
  const hl = document.createElement('div');
  hl.className = 'hl';
  const frag = document.createDocumentFragment();
  for (let k = 0; k < p.boxes.length; k++) {
    const b = p.boxes[k];
    if (!b) continue;
    const d = document.createElement('div');
    d.className = 'w';
    d.style.cssText = `left:${b.x * VW}px;top:${b.y * VH}px;width:${b.w * VW}px;height:${b.h * VH}px`;
    tokens[p.tokStart + k].el = d;
    frag.append(d);
  }
  hl.append(frag);
  p.hv = document.createElement('div');
  p.hv.className = 'hv';
  hl.append(p.hv);

  // 선택/복사용 투명 텍스트 레이어: 단어 위치에 맞춰 줄 단위로 폭을 보정
  const tl = document.createElement('div');
  tl.className = 'tl';
  let lastFont = '';
  for (const item of p.items) {
    const style = p.styles[item.fontName] || {};
    const family = style.fontFamily || 'sans-serif';
    const bx = item.toks.map(ti => p.boxes[ti - p.tokStart]);
    let ascR = 1;
    if (style.ascent) ascR = style.ascent;
    else if (style.descent) ascR = 1 + style.descent;

    let text, left, top, fh, targetW, tf = '';
    if (bx.length && bx.every(Boolean)) {
      const t0 = tokens[item.toks[0]], t1 = tokens[item.toks[item.toks.length - 1]];
      text = item.str.slice(t0.s, t1.e);
      fh = bx[0].f * VW;
      left = bx[0].x * VW;
      top = bx[0].b * VH - ascR * fh;
      targetW = (bx[bx.length - 1].x + bx[bx.length - 1].w - bx[0].x) * VW;
    } else {
      const tx = pdfjsLib.Util.transform(vp.transform, item.transform);
      let angle = Math.atan2(tx[1], tx[0]);
      if (style.vertical) angle += Math.PI / 2;
      fh = Math.hypot(tx[2], tx[3]);
      const asc = ascR * fh;
      text = item.str;
      left = angle === 0 ? tx[4] : tx[4] + asc * Math.sin(angle);
      top = angle === 0 ? tx[5] - asc : tx[5] - asc * Math.cos(angle);
      targetW = (style.vertical ? item.height : item.width) * vp.scale;
      if (angle) tf = `rotate(${angle}rad) `;
    }
    const font = `${fh}px ${family}`;
    if (font !== lastFont) { measureCtx.font = font; lastFont = font; }
    const mw = measureCtx.measureText(text).width;
    if (mw > 0 && targetW > 0) tf += `scaleX(${targetW / mw})`;

    const div = document.createElement('div');
    div.className = 'ti';
    div.textContent = text;
    div.style.cssText = `left:${left}px;top:${top}px;font-size:${fh}px;font-family:${family}` + (tf ? `;transform:${tf}` : '');
    tl.append(div);
  }
  p.wrapper.append(hl, tl);
}

function applyLayout() {
  const anchor = captureAnchor();
  for (const p of pages) {
    sizeWrapper(p);
    if (p.rendered || p.rendering) unrenderPage(p);
    if (p.want) renderPage(p);
  }
  topsValid = false;
  restoreAnchor(anchor);
  updateZoomUI();
  updateCurrentPage();
}

function captureAnchor() {
  const top = chromeH();
  for (const p of pages) {
    const r = p.wrapper.getBoundingClientRect();
    if (r.bottom > top + 1) return { p, frac: (top - r.top) / (r.height || 1) };
  }
  return null;
}
function restoreAnchor(a) {
  if (!a) return;
  const r = a.p.wrapper.getBoundingClientRect();
  window.scrollTo(0, window.scrollY + r.top + a.frac * r.height - chromeH());
}

/* ---- 클릭 / 호버: 화면 좌표로 단어 박스를 찾는다 (DOM 요소에 의존하지 않음) ---- */
function hitToken(p, e) {
  if (!p.boxes || !p.rendered) return -1;
  const r = p.wrapper.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const tx = 3 / r.width, ty = 3 / r.height;
  let best = -1, bestD = 1e9;
  for (let k = 0; k < p.boxes.length; k++) {
    const b = p.boxes[k];
    if (!b) continue;
    if (fy < b.y - ty || fy > b.y + b.h + ty) continue;
    const dx = fx < b.x ? b.x - fx : fx > b.x + b.w ? fx - (b.x + b.w) : 0;
    if (dx === 0) return p.tokStart + k;
    const dpx = dx * r.width;
    if (dpx < 10 && dpx < bestD) { bestD = dpx; best = p.tokStart + k; }
  }
  return best;
}

let hoverP = null, hoverRaf = 0, hoverEvt = null;
function onHover() {
  hoverRaf = 0;
  const e = hoverEvt;
  const pg = e.target.closest && e.target.closest('.page');
  const p = pg ? pg._page : null;
  if (hoverP && hoverP !== p && hoverP.hv) hoverP.hv.style.display = 'none';
  hoverP = p;
  if (!p) return;
  const ti = hitToken(p, e);
  p.wrapper.style.cursor = ti >= 0 ? 'pointer' : '';
  if (!p.hv) return;
  const b = ti >= 0 ? p.boxes[ti - p.tokStart] : null;
  if (!b) { p.hv.style.display = 'none'; return; }
  const r = p.wrapper.getBoundingClientRect();
  p.hv.style.cssText = `display:block;left:${b.x * r.width}px;top:${b.y * r.height}px;width:${b.w * r.width}px;height:${b.h * r.height}px`;
}

/* =====================================================================
 * 4. 쪽 이동 (현재 쪽 표시 / 번호 입력 이동)
 * ===================================================================== */
let pageTops = [];
let topsValid = false;
let curPage = 1;

function ensureTops() {
  if (topsValid && pageTops.length === pages.length) return;
  const sy = window.scrollY;
  pageTops = pages.map(p => p.wrapper.getBoundingClientRect().top + sy);
  topsValid = true;
}

function pageAtScroll() {
  if (!pages.length) return 1;
  ensureTops();
  const ref = window.scrollY + chromeH() + (window.innerHeight - chromeH()) * 0.3;
  return floorIndex(pageTops, ref) + 1;
}

function updateCurrentPage() {
  const n = pageAtScroll();
  curPage = n;
  if (document.activeElement !== els.pageInput) els.pageInput.value = pages.length ? String(n) : '';
  els.pgPrev.disabled = !pages.length || n <= 1;
  els.pgNext.disabled = !pages.length || n >= pages.length;
}

function goToPage(n) {
  if (!pages.length) return;
  n = clamp(Math.round(n) || 1, 1, pages.length);
  topsValid = false;
  ensureTops();
  lastUserScroll = Date.now();            // 직접 이동했으니 잠시 자동 따라가기를 멈춘다
  window.scrollTo(0, pageTops[n - 1] - chromeH() - 8);
  updateCurrentPage();
}

let scrollRaf = 0;
window.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; updateCurrentPage(); });
}, { passive: true });

els.pageInput.addEventListener('focus', () => els.pageInput.select());
els.pageInput.addEventListener('input', () => { els.pageInput.value = els.pageInput.value.replace(/\D/g, '').slice(0, 6); });
els.pageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { goToPage(parseInt(els.pageInput.value, 10)); els.pageInput.blur(); }
  else if (e.key === 'Escape') { els.pageInput.blur(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); goToPage(curPage - 1); els.pageInput.select(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); goToPage(curPage + 1); els.pageInput.select(); }
  e.stopPropagation();
});
els.pageInput.addEventListener('blur', () => { els.pageInput.value = pages.length ? String(curPage) : ''; });
els.pgPrev.addEventListener('click', () => goToPage(curPage - 1));
els.pgNext.addEventListener('click', () => goToPage(curPage + 1));

/* ---- 배율 ---- */
function effectivePct() {
  return pages.length ? Math.round(pages[0].scale / PT_TO_PX * 100) : 100;
}
function updateZoomUI() {
  els.zoomSel.value = zoomMode === 'pct' ? String(zoomPct) : zoomMode;
  if (zoomMode === 'pct' && els.zoomSel.value !== String(zoomPct)) els.zoomSel.selectedIndex = -1;
  els.zoomEff.textContent = pages.length ? effectivePct() + '%' : '';
  els.zoomOut.disabled = els.zoomIn.disabled = !pages.length;
}
function setZoom(mode, pct) {
  zoomMode = mode;
  if (pct) zoomPct = pct;
  store.set('zoomMode', zoomMode);
  store.set('zoomPct', zoomPct);
  applyLayout();
}
els.zoomSel.addEventListener('change', () => {
  const v = els.zoomSel.value;
  if (v === 'width' || v === 'page') setZoom(v); else setZoom('pct', +v);
});
els.zoomIn.addEventListener('click', () => {
  const cur = effectivePct();
  setZoom('pct', ZOOM_PRESETS.find(v => v > cur + 1) || ZOOM_PRESETS[ZOOM_PRESETS.length - 1]);
});
els.zoomOut.addEventListener('click', () => {
  const cur = effectivePct();
  setZoom('pct', [...ZOOM_PRESETS].reverse().find(v => v < cur - 1) || ZOOM_PRESETS[0]);
});

/* =====================================================================
 * 5. 하이라이트 / 자동 스크롤
 * ===================================================================== */
let active = -1;          // 현재 읽는 단어 토큰
let sentIdx = null;       // 현재 문장(청크)의 토큰 목록
let pendingScroll = false;
let lastUserScroll = 0;
const lit = new Set();

['wheel', 'touchmove'].forEach(ev =>
  window.addEventListener(ev, () => { lastUserScroll = Date.now(); }, { passive: true }));

function setActive(ti, chunk) {
  active = ti;
  if (chunk !== undefined) sentIdx = chunk ? chunk.idx : null;
  applyHighlight(true);
  showPlayStatus();
}

function clearHighlight() {
  active = -1; sentIdx = null; pendingScroll = false;
  for (const el of lit) el.classList.remove('active', 'sent');
  lit.clear();
}

function applyHighlight(scroll) {
  for (const el of lit) el.classList.remove('active', 'sent');
  lit.clear();
  if (active < 0) return;
  if (sentIdx) {
    for (const i of sentIdx) {
      const el = tokens[i].el;
      if (el) { el.classList.add('sent'); lit.add(el); }
    }
  }
  const t = tokens[active];
  if (!t) return;
  const mark = tk => { if (tk && tk.el) { tk.el.classList.add('active'); lit.add(tk.el); } };
  for (let k = active; k < tokens.length; k++) {      // 줄바꿈으로 갈라진 한 단어는 함께 칠한다
    mark(tokens[k]);
    if (!tokens[k].joined) break;
  }

  if (t.el) {
    pendingScroll = false;
    if (scroll) keepVisible(t.el);
  } else if (scroll && Date.now() - lastUserScroll > 3000) {
    pendingScroll = true;
    goToPageQuiet(t.p);
  }
}

function keepVisible(el) {
  if (Date.now() - lastUserScroll < 3000) return;
  const r = el.getBoundingClientRect();
  const top = chromeH() + 24;
  if (r.top < top || r.bottom > window.innerHeight * 0.8) {
    window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * 0.35, behavior: 'smooth' });
  }
}

function goToPageQuiet(pi) {
  const r = pages[pi].wrapper.getBoundingClientRect();
  window.scrollTo(0, window.scrollY + r.top - chromeH() - 8);
}

function firstVisibleToken() {
  const top = chromeH() + 4;
  for (const p of pages) {
    if (p.wrapper.getBoundingClientRect().bottom <= top) continue;
    for (let i = p.tokStart; i < p.tokEnd; i++) {
      const el = tokens[i].el;
      if (el && el.getBoundingClientRect().top >= top) return i;
    }
    if (p.tokEnd > p.tokStart) return p.tokStart;
  }
  return 0;
}

/* =====================================================================
 * 6. 음성 재생 (영어)
 *    - 문장(청크) 단위 utterance 를 1개 앞서 대기열에 넣어 끊김 없이 이어 읽음
 *    - 일시정지 = cancel + 위치 기억 (브라우저별 pause/resume 버그 회피)
 *    - gen 값으로 이전 utterance 의 늦은 이벤트를 무시
 * ===================================================================== */
const MAX_SOFT = 180, MAX_HARD = 300;
let state = 'idle';       // idle | playing | paused
let cursor = 0;           // 읽는 중(또는 이어 읽을) 단어 토큰
let gen = 0;
let nextFrom = 0;
let queued = 0;
let currentChunk = null;
let watchTimer = 0;
let noBoundaryNote = '';
const live = new Set();   // utterance 가 GC 되어 이벤트가 사라지는 문제 방지

function buildChunk(from) {
  const skipEdges = els.edges.checked;
  let i = from;
  while (i < tokens.length && skipEdges && tokens[i].edge) i++;
  if (i >= tokens.length) return null;

  const idx = [], offs = [];
  let text = '', gap = false;
  for (; i < tokens.length; i++) {
    const t = tokens[i];
    if (skipEdges && t.edge) { gap = true; continue; }
    if (gap && idx.length && !/\s$/.test(text) && !tokens[idx[idx.length - 1]].joined) text += ' ';
    gap = false;
    idx.push(i);
    offs.push(text.length);
    text += t.speak + t.sep;
    if (t.end) { i++; break; }
    if (text.length > MAX_SOFT && /[,;:)]$/.test(t.speak)) { i++; break; }
    if (text.length > MAX_HARD) { i++; break; }
  }
  return { idx, offs, text, first: idx[0], next: i };
}

let voices = [];
let bestEnVoice;

function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices().slice();
  const en = all.filter(v => /^en([-_]|$)/i.test(v.lang));
  voices = en.length ? en : all;
  bestEnVoice = undefined;
  const cur = els.voice.options.length > 1 ? els.voice.value : store.get('voice', 'auto');
  els.voice.length = 1;
  const rank = v => /^en[-_]US/i.test(v.lang) ? 0 : /^en[-_]GB/i.test(v.lang) ? 1 : 2;
  [...voices]
    .sort((a, b) => rank(a) - rank(b) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name))
    .forEach(v => els.voice.add(new Option(
      `${v.name} (${v.lang})${v.localService ? '' : ' · 온라인'}`, v.voiceURI)));
  els.voice.value = [...els.voice.options].some(o => o.value === cur) ? cur : 'auto';
}

function pickVoice() {
  const sel = els.voice.value;
  if (sel !== 'auto') {
    const v = voices.find(x => x.voiceURI === sel);
    if (v) return v;
  }
  if (bestEnVoice === undefined) {
    // 단어 위치 이벤트를 주는 로컬 음성을 우선한다
    const score = v => (/^en[-_]US/i.test(v.lang) ? 4 : 0) + (v.localService ? 2 : 0) + (v.default ? 1 : 0);
    bestEnVoice = [...voices].sort((a, b) => score(b) - score(a))[0] || null;
  }
  return bestEnVoice;
}

function cancelSpeech() {
  gen++;
  queued = 0;
  currentChunk = null;
  clearTimeout(watchTimer);
  if (synth) { try { synth.cancel(); } catch {} }
}

function startFrom(idx) {
  if (!tokens.length || !synth) return;
  cancelSpeech();
  cursor = clamp(idx, 0, tokens.length - 1);
  nextFrom = cursor;
  state = 'playing';
  noBoundaryNote = '';
  lastUserScroll = 0;
  setActive(cursor, null);
  updateUI();
  const g = gen;
  // cancel() 직후 곧바로 speak() 하면 일부 브라우저가 무시하므로 잠깐 대기
  setTimeout(() => { if (g === gen) pump(g); }, 50);
}

function pump(g) {
  while (g === gen && state === 'playing' && queued < 2) {
    const c = buildChunk(nextFrom);
    if (!c) { if (queued === 0) finish(); return; }
    nextFrom = c.next;
    if (!c.text.trim()) continue;
    try {
      speakChunk(c, g);
    } catch (e) {
      cancelSpeech();
      state = 'paused';
      updateUI();
      setStatus('음성 재생을 시작하지 못했습니다: ' + (e && e.message ? e.message : e), true);
      return;
    }
  }
}

function speakChunk(c, g) {
  const u = new SpeechSynthesisUtterance(c.text);
  const voice = pickVoice();
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : 'en-US';
  u.rate = parseFloat(els.rate.value) || 1;

  let sawBoundary = false;
  u.onstart = () => {
    if (g !== gen) return;
    clearTimeout(watchTimer);
    currentChunk = c;
    cursor = c.first;
    setActive(c.first, c);
    if (c.idx.length > 3) {
      setTimeout(() => { if (g === gen && currentChunk === c && !sawBoundary) flagNoBoundary(); }, 1500);
    }
  };
  u.onboundary = ev => {
    if (g !== gen || currentChunk !== c) return;
    if (ev.name && ev.name !== 'word') return;
    sawBoundary = true;
    const ti = c.idx[floorIndex(c.offs, ev.charIndex)];
    cursor = ti;
    setActive(ti);
  };
  u.onend = () => {
    live.delete(u);
    if (g !== gen) return;
    if (!sawBoundary && c.idx.length > 3) flagNoBoundary();
    queued--;
    pump(g);
  };
  u.onerror = ev => {
    live.delete(u);
    if (g !== gen) return;
    if (ev.error === 'canceled' || ev.error === 'interrupted') return;
    cancelSpeech();
    state = 'paused';
    updateUI();
    setStatus(`음성 재생 오류: ${ev.error}`, true);
  };

  live.add(u);
  queued++;
  if (queued === 1) {
    clearTimeout(watchTimer);
    watchTimer = setTimeout(() => {
      if (g === gen && !currentChunk) {
        setStatus('음성이 시작되지 않습니다. 설치된 음성이 없거나 브라우저가 재생을 막았을 수 있습니다.', true);
      }
    }, 6000);
  }
  synth.speak(u);
}

function flagNoBoundary() {
  if (noBoundaryNote) return;
  noBoundaryNote = ' · 이 음성은 단어 위치를 알려주지 않아 문장 단위로 표시합니다 (로컬 음성을 선택해 보세요)';
  showPlayStatus();
}

function showPlayStatus() {
  if (state !== 'playing') return;
  const t = tokens[active];
  setStatus(`재생 중 · ${t ? t.p + 1 : 1} / ${pages.length} 쪽${noBoundaryNote}`);
}

function pause() {
  if (state !== 'playing') return;
  cancelSpeech();
  state = 'paused';
  updateUI();
  setStatus('일시정지 — ▶ 를 누르면 현재 단어부터 이어 읽습니다.');
}

function stop() {
  cancelSpeech();
  state = 'idle';
  cursor = 0;
  clearHighlight();
  updateUI();
  if (tokens.length) setStatus('정지됨. ▶ 를 누르면 화면에 보이는 위치부터 읽습니다.');
}

function finish() {
  cancelSpeech();
  state = 'idle';
  cursor = 0;
  clearHighlight();
  updateUI();
  setStatus('끝까지 읽었습니다.');
}

function jumpSentence(dir) {
  if (!tokens.length) return;
  let k = floorIndex(sentStarts, cursor);
  if (dir > 0) k++;
  else if (cursor <= sentStarts[k]) k--;
  k = clamp(k, 0, sentStarts.length - 1);
  startFrom(sentStarts[k]);
}

function togglePlay() {
  if (state === 'playing') pause();
  else if (state === 'paused') startFrom(cursor);
  else startFrom(cursor > 0 ? cursor : firstVisibleToken());
}

function locate() {
  if (active < 0) return;
  lastUserScroll = 0;
  const t = tokens[active];
  if (t.el) {
    const r = t.el.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * 0.35, behavior: 'smooth' });
  } else {
    goToPageQuiet(t.p);
    pendingScroll = true;
  }
}

function updateUI() {
  const ready = tokens.length > 0 && !!synth;
  els.play.disabled = els.stop.disabled = els.prev.disabled = els.next.disabled = !ready;
  els.locate.disabled = !ready || active < 0;
  els.play.textContent = state === 'playing' ? '⏸ 일시정지' : state === 'paused' ? '▶ 이어서' : '▶ 재생';
}

/* =====================================================================
 * 7. PDF 로드
 * ===================================================================== */
function resetDocument() {
  cancelSpeech();
  state = 'idle';
  cursor = 0;
  clearHighlight();
  io.disconnect();
  els.container.replaceChildren();
  tokens = [];
  sentStarts = [];
  pages.length = 0;
  pageTops = [];
  topsValid = false;
  curPage = 1;
  els.progress.style.width = '0';
  els.pageInput.value = '';
  els.pageInput.disabled = true;
  els.pageTotal.textContent = '/ –';
  if (pdfDoc) { pdfDoc.destroy().catch(() => {}); pdfDoc = null; }
  updateUI();
  updateZoomUI();
  updateCurrentPage();
}

async function loadPdf(file) {
  const id = ++loadId;
  resetDocument();
  els.docName.textContent = file.name;
  els.docName.title = file.name;
  document.title = file.name + ' · PDF Reader';
  setStatus(`"${file.name}" 여는 중…`);

  let data;
  try { data = await file.arrayBuffer(); }
  catch (e) { setStatus('파일을 읽을 수 없습니다.', true); return; }
  if (id !== loadId) return;

  const task = pdfjsLib.getDocument({ data });
  task.onPassword = (update, reason) => {
    const pw = prompt(reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD
      ? '비밀번호가 올바르지 않습니다. 다시 입력하세요.' : '비밀번호가 필요한 PDF입니다.');
    if (pw === null) task.destroy(); else update(pw);
  };

  let doc;
  try { doc = await task.promise; }
  catch (e) {
    if (id === loadId) setStatus('PDF를 열 수 없습니다: ' + (e && e.message ? e.message : e), true);
    return;
  }
  if (id !== loadId) { doc.destroy(); return; }
  pdfDoc = doc;
  els.pageTotal.textContent = '/ ' + doc.numPages;
  els.pageInput.disabled = false;

  try {
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const vp1 = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      if (id !== loadId) return;

      const ex = extractPage(n - 1, tc, vp1);
      const wrapper = document.createElement('div');
      wrapper.className = 'page';
      const p = {
        n, index: n - 1, wrapper, base: { w: vp1.width, h: vp1.height },
        items: ex.items, styles: tc.styles, tokStart: ex.first, tokEnd: ex.last,
        scale: 1, gen: 0, want: false, rendered: false, rendering: false, task: null,
        boxes: null, hv: null,
      };
      wrapper._page = p;
      sizeWrapper(p);
      pages.push(p);
      els.container.append(wrapper);
      io.observe(wrapper);
      topsValid = false;
      if (n === 1) updateZoomUI();
      updateCurrentPage();

      els.progress.style.width = (n / doc.numPages * 100) + '%';
      if (n === 1 || n % 10 === 0) setStatus(`텍스트 분석 중… ${n} / ${doc.numPages} 쪽`);
    }
  } catch (e) {
    if (id === loadId) setStatus('PDF 분석 중 오류: ' + (e && e.message ? e.message : e), true);
    return;
  }

  markEdges();
  computeSentences();
  els.progress.style.width = '0';
  updateUI();
  updateZoomUI();
  if (!tokens.length) {
    setStatus('읽을 수 있는 텍스트가 없습니다. 스캔 이미지 PDF라면 먼저 OCR이 필요합니다.', true);
  } else {
    setStatus(`준비 완료 · ${doc.numPages}쪽 · ${tokens.length.toLocaleString()}단어. ▶ 를 누르거나 읽을 단어를 클릭하세요.`);
  }
}

/* =====================================================================
 * 8. 이벤트 연결
 * ===================================================================== */
els.input.addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';           // 같은 파일을 다시 선택해도 change 가 발생하도록
  if (f) loadPdf(f);
});

els.play.addEventListener('click', togglePlay);
els.stop.addEventListener('click', stop);
els.prev.addEventListener('click', () => jumpSentence(-1));
els.next.addEventListener('click', () => jumpSentence(+1));
els.locate.addEventListener('click', locate);

function restartIfPlaying() { if (state === 'playing') startFrom(cursor); }
els.rate.addEventListener('change', () => { store.set('rate', els.rate.value); restartIfPlaying(); });
els.voice.addEventListener('change', () => { store.set('voice', els.voice.value); restartIfPlaying(); });
els.edges.addEventListener('change', () => { store.set('edges', els.edges.checked ? '1' : '0'); restartIfPlaying(); });

els.container.addEventListener('click', e => {
  const pg = e.target.closest && e.target.closest('.page');
  if (!pg) return;
  if (String(window.getSelection()).trim()) return;      // 드래그 선택은 재생으로 취급하지 않음
  const ti = hitToken(pg._page, e);
  if (ti >= 0) startFrom(ti);
});
els.container.addEventListener('mousemove', e => { hoverEvt = e; if (!hoverRaf) hoverRaf = requestAnimationFrame(onHover); });
els.container.addEventListener('mouseleave', () => { if (hoverP && hoverP.hv) hoverP.hv.style.display = 'none'; });

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'SELECT' || tag === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); jumpSentence(+1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); jumpSentence(-1); }
  else if (e.key === 'Escape') stop();
  else if ((e.key === 'g' || e.key === 'G') && pages.length) { e.preventDefault(); els.pageInput.focus(); }
});

// 드래그 앤 드롭
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name))) loadPdf(f);
});

let resizeTimer = 0, lastW = els.container.clientWidth, lastH = window.innerHeight;
window.addEventListener('resize', () => {
  topsValid = false;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = els.container.clientWidth, h = window.innerHeight;
    const relayout = zoomMode === 'width' ? w !== lastW : zoomMode === 'page' ? (w !== lastW || h !== lastH) : false;
    lastW = w; lastH = h;
    if (relayout && pages.length) applyLayout(); else updateCurrentPage();
  }, 250);
});

window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

/* 초기 설정 복원 */
els.rate.value = store.get('rate', '1');
if (!els.rate.value) els.rate.value = '1';
els.edges.checked = store.get('edges', '1') === '1';
updateZoomUI();
if (synth) {
  loadVoices();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
  else synth.onvoiceschanged = loadVoices;
}
updateUI();
})();
</script>
</body>
</html>
